<svg viewBox="0 0 1200 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="skills">
  <defs>
    <style>
      @font-face { font-family: 'VT'; src: url(data:font/woff2;base64,) format('woff2'); }
      text { font-family: 'VT', monospace; }
      .bg { fill: #0b120d; }
      .t { font-size: 34px; fill: oklch(68% 0.09 145); }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="70" />
  <text class="t" x="30" y="45">&gt; skills<tspan class="cursor">_</tspan></text>
</svg>
