<svg viewBox="0 0 960 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An animated circuit trace connecting five nodes">
  <style>
    .trace { fill: none; stroke: #8b949e; stroke-width: 1.6; }
    .node { fill: #8b949e; }
    .halo { fill: #58a6ff; }
    .pulse { fill: #58a6ff; }
    @media (prefers-color-scheme: light) {
      .trace { stroke: #6e7681; }
      .node { fill: #6e7681; }
      .halo { fill: #2f6feb; }
      .pulse { fill: #2f6feb; }
    }
  </style>

  <path class="trace" d="M40,60 L160,60 L160,30 L280,30 L380,30 L380,90 L480,90 L580,90 L580,30 L680,30 L800,30 L800,60 L920,60" />

  <g>
    <circle class="node" cx="40" cy="60" r="4.5" />
    <circle class="node" cx="280" cy="30" r="4.5" />
    <circle class="node" cx="480" cy="90" r="4.5" />
    <circle class="node" cx="680" cy="30" r="4.5" />
    <circle class="node" cx="920" cy="60" r="4.5" />
  </g>

  <g>
    <circle class="halo" cx="40" cy="60" r="9" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.02;0.06;1" values="0;0.9;0;0" />
    </circle>
    <circle class="halo" cx="280" cy="30" r="9" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.22;0.26;0.30;1" values="0;0;0.9;0;0" />
    </circle>
    <circle class="halo" cx="480" cy="90" r="9" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.47;0.51;0.55;1" values="0;0;0.9;0;0" />
    </circle>
    <circle class="halo" cx="680" cy="30" r="9" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.72;0.76;0.80;1" values="0;0;0.9;0;0" />
    </circle>
    <circle class="halo" cx="920" cy="60" r="9" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.95;0.98;1" values="0;0;0.9;0" />
    </circle>
  </g>

  <circle class="pulse" r="4">
    <animateMotion dur="5s" repeatCount="indefinite"
      path="M40,60 L160,60 L160,30 L280,30 L380,30 L380,90 L480,90 L580,90 L580,30 L680,30 L800,30 L800,60 L920,60" />
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.03;0.95;1" values="0;1;1;0" />
  </circle>
</svg>
