<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tia Parekh — hand-sketched circuit lines woven around her name">
  <defs>
    <filter id="wobble" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="6" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" />
    </filter>
    <style>
      @font-face {
        font-family: 'UB';
        font-weight: 800;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      text { font-family: 'UB', sans-serif; }
      .bg { fill: oklch(14% 0.01 95); }
      .wire { fill: none; stroke: oklch(45% 0.01 95); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; filter: url(#wobble); }
      .wire.a { stroke-dasharray: 3 15; animation: flow 9s linear infinite; }
      .wire.b { stroke-dasharray: 3 18; animation: flow 12s linear infinite reverse; }
      .wire.c { stroke-dasharray: 4 14; animation: flow 7.5s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -380; } }
      .node { filter: url(#wobble); animation: pulse 2.6s ease-in-out infinite; }
      .node.green { fill: oklch(68% 0.09 145); }
      .node.salmon { fill: oklch(76% 0.11 25); }
      @keyframes pulse { 0%, 100% { opacity: 0.4; r: 5; } 50% { opacity: 1; r: 8; } }
      .tia { font-size: 84px; fill: oklch(95% 0.004 95); }
      .pk-box { fill: oklch(68% 0.09 145); }
      .pk-text { font-size: 84px; fill: oklch(20% 0.05 145); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="380" />

  <path class="wire a" d="M-20,60 L200,40 L340,110 L520,70 L720,130 L900,60 L1220,100" />
  <path class="wire b" d="M-20,320 L180,290 L360,340 L560,300 L760,350 L980,300 L1220,330" />
  <path class="wire c" d="M40,-20 L90,120 L30,220 L110,340 L60,410" />
  <path class="wire a" d="M1160,-20 L1120,100 L1180,200 L1100,320 L1160,410" />
  <path class="wire b" d="M-20,190 L120,190 L200,175 L260,189" />
  <path class="wire c" d="M700,-20 L680,110 L720,189 L730,189" />
  <path class="wire a" d="M1220,230 L1000,245 L820,210 L700,230 L730,189" />

  <circle class="node salmon" cx="260" cy="189" r="6" style="animation-delay:0s" />
  <circle class="node green" cx="730" cy="189" r="6" style="animation-delay:0.6s" />
  <circle class="node green" cx="340" cy="110" r="5" style="animation-delay:1.1s" />
  <circle class="node salmon" cx="1120" cy="100" r="5" style="animation-delay:1.6s" />
  <circle class="node green" cx="110" cy="340" r="5" style="animation-delay:0.3s" />
  <circle class="node salmon" cx="980" cy="300" r="5" style="animation-delay:1.9s" />

  <text class="tia" x="70" y="212">TIA</text>
  <rect class="pk-box" x="275" y="132" width="455" height="100" rx="0" />
  <text class="pk-text" x="280" y="212">PAREKH</text>
</svg>
